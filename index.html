<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuarios</title>
    <!-- Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div class="container mt-4 mb-5 flex-grow-1">
    <!-- Título Principal -->
    <div class="row justify-content-center mb-4">
        <div class="col text-center">
            <h2 class="font-weight-bold text-dark"><i class="fa fa-users" aria-hidden="true"></i> Gestión de Usuarios</h2>
            <hr class="w-25">
        </div>
    </div>

    <!-- Contenedor para Alertas Dinámicas (Éxito / Error) -->
    <div class="row">
        <div class="col-12" id="result">
            <!-- Aquí se inyectarán las alertas mediante JavaScript -->
        </div>
    </div>

    <div class="row">
        <!-- Tabla de Listado (Columna Izquierda - Ancho 8) -->
        <div class="col-lg-8 col-md-12 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fa fa-list" aria-hidden="true"></i> Lista de Usuarios Registrados</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="thead-dark">
                                <tr>
                                    <th scope="col">#</th>
                                    <th scope="col">Nombre</th>
                                    <th scope="col">Apellido</th>
                                    <th scope="col">Email</th>
                                    <th scope="col" colspan="2" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="listado">
                                <!-- Los registros se cargarán dinámicamente con app.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario de Registro / Edición (Columna Derecha - Ancho 4) -->
        <div class="col-lg-4 col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">
                    <h5 class="mb-0"><i class="fa fa-user-plus" aria-hidden="true"></i> Formulario de Usuario</h5>
                </div>
                <div class="card-body">
                    <form id="form">
                        <!-- Campo oculto para almacenar el ID al momento de editar -->
                        <input type="hidden" id="id">
                        
                        <div class="form-group">
                            <label for="nombre"><i class="fa fa-user"></i> Nombres</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ingrese su nombre..." required>
                        </div>
                        
                        <div class="form-group">
                            <label for="apellido"><i class="fa fa-user-o"></i> Apellidos</label>
                            <input type="text" id="apellido" class="form-control" placeholder="Ingrese su apellido..." required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email"><i class="fa fa-envelope"></i> Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" placeholder="Ingrese su email..." required>
                        </div>

                        <div class="form-group">
                            <label for="clave"><i class="fa fa-lock"></i> Contraseña</label>
                            <input type="password" id="clave" class="form-control" placeholder="Ingrese su contraseña...">
                            <small class="form-text text-muted">Si edita, déjelo vacío para conservar la actual.</small>
                        </div>
                        
                        <button type="submit" class="add btn btn-success btn-block"><i class="fa fa-floppy-o" aria-hidden="true"></i> Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Footer Pequeño -->
<footer class="bg-white border-top py-3 mt-auto text-center text-muted">
    <div class="container">
        <small><i class="fa fa-code"></i> Gestión de Usuarios &copy; 2026 — Desarrollado con PHP, AJAX y Bootstrap</small>
    </div>
</footer>

<!-- Bootstrap JS Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<!-- Tu archivo JavaScript personalizado -->

</body>
</html>
